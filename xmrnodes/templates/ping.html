<script>
/**
 * Measures round-trip time to a given endpoint in milliseconds.
 * Performs a warm-up ping followed by averaged sample pings.
 */
async function measureLatency(endpointUrl, samples = 3) {
  // Helper to run a single HTTP HEAD request
  const pingOnce = async () => {
    // Cache buster guarantees we test actual network speed, not browser cache
    const cacheBuster = `_t=${Date.now()}_${Math.random()}`;
    const url = endpointUrl.includes('?') 
      ? `${endpointUrl}&${cacheBuster}` 
      : `${endpointUrl}?${cacheBuster}`;

    const start = performance.now();
    try {
      await fetch(url, { method: 'HEAD', cache: 'no-store' });
      return performance.now() - start;
    } catch (err) {
      return Infinity; // Endpoint reachable or CORS failed
    }
  };

  // 1. Warm-up request (establishes TCP/TLS connection)
  await pingOnce();

  // 2. Gather ping samples
  let totalLatency = 0;
  let successfulSamples = 0;

  for (let i = 0; i < samples; i++) {
    const latency = await pingOnce();
    if (latency !== Infinity) {
      totalLatency += latency;
      successfulSamples++;
    }
  }

  return successfulSamples > 0 ? Math.round(totalLatency / successfulSamples) : Infinity;
}

/**
 * Tests multiple Flask server endpoints and picks the fastest.
 */
async function findClosestServer(serverList) {
  const results = await Promise.all(
    serverList.map(async (server) => {
      const latency = await measureLatency(server.url);
      return { name: server.name, url: server.url, latency };
    })
  );

  // Sort by lowest latency
  results.sort((a, b) => a.latency - b.latency);
  return results;
}

// Example usage:
const flaskServers = [
  { name: 'US East Region', url: 'https://us-east.yourdomain.com/ping' },
  { name: 'US West Region', url: 'https://us-west.yourdomain.com/ping' },
  { name: 'EU Central Region', url: 'https://eu-central.yourdomain.com/ping' }
];

// Run test on load or trigger via button
window.addEventListener('DOMContentLoaded', async () => {
  console.log("Measuring region latencies...");
  const rankings = await findClosestServer(flaskServers);
  
  console.log("Latency Results:", rankings);
  const bestServer = rankings[0];
  
  if (bestServer.latency !== Infinity) {
    console.log(`Closest server is ${bestServer.name} (${bestServer.latency}ms)`);
  } else {
    console.error("Could not reach any server endpoints.");
  }
});
</script>
